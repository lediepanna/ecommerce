<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Registrera</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h2>Registrera nytt konto</h2>
    <div th:if="${error}" style="color:red">[[${error}]]</div>
    <form method="post" th:action="@{/register}" th:object="${registerRequest}">
        <input type="text" th:field="*{username}" placeholder="Användarnamn" required><br>
        <input type="email" th:field="*{email}" placeholder="E-post" required><br>
        <input type="password" th:field="*{password}" placeholder="Lösenord" required><br>
        <button type="submit">Registrera</button>
    </form>
    <p>Redan medlem? <a th:href="@{/login}">Logga in</a></p>
</div>
</body>
</html>
