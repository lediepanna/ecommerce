<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Varukorg</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h1>Din varukorg</h1>
    <div th:if="${cart.empty}">Varukorgen är tom.</div>
    <div th:unless="${cart.empty}">
        <table border="1">
            <tr><th>Produkt</th><th>Pris</th><th>Antal</th><th>Totalt</th><th></th></tr>
            <tr th:each="item : ${cart.items.values()}">
                <td th:text="${item.name}"></td>
                <td th:text="${item.price}"></td>
                <td th:text="${item.quantity}"></td>
                <td th:text="${item.price * item.quantity}"></td>
                <td>
                    <form method="post" th:action="@{/cart/remove/{id}(id=${item.productId})}">
                        <button type="submit">Ta bort</button>
                    </form>
                </td>
            </tr>
        </table>
        <form method="post" th:action="@{/checkout}">
            <button type="submit">Gå till kassan</button>
        </form>
    </div>
    <p><a th:href="@{/products}">Fortsätt handla</a></p>
</div>
</body>
</html>
