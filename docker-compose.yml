services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: Root@1345678
      MYSQL_DATABASE: cloudstore
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    restart: always
  app:
    image: annalediep/cloudstore:latest
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/cloudstore?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Root@1345678
    depends_on:
      - db
    restart: always
volumes:
  db_data: